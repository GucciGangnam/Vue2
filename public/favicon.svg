<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- A lamp above a widening cone of light: one light, one room. Palette is
       the app's own tokens -- ink-950 #0a0a0c and lamp-500 #f39500. -->
  <defs>
    <radialGradient id="glow" cx="50%" cy="29%" r="34%">
      <stop offset="35%" stop-color="#f39500" stop-opacity=".55" />
      <stop offset="100%" stop-color="#f39500" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f39500" stop-opacity=".5" />
      <stop offset="100%" stop-color="#f39500" stop-opacity=".06" />
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="#0a0a0c" />
  <path d="M32 18.6 L55 64 H9 Z" fill="url(#beam)" />
  <rect width="64" height="64" rx="14" fill="url(#glow)" />
  <circle cx="32" cy="18.6" r="7.2" fill="#f39500" />
</svg>
